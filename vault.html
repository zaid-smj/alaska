<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Alaska Batteries Pakistan</title>
  <meta name="description"
    content="Photos of Alaska Batteries: our corporate events, partner network and awards.">
  <meta name="keywords"
    content="Alaska Batteries gallery, Alaska Batteries awards, Alaska Batteries partners, Alaska Batteries events">
  <script>
    // Site theme (light / dark / system), applied before first paint. See js/components.js → AlaskaTheme.
    (function () {
      var p = "light";
      try { p = localStorage.getItem("alaska-theme") || "light"; } catch (e) {}
      if (p === "system") p = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", p === "dark" ? "dark" : "light");
    })();
  </script>
  <link rel="canonical" href="https://alaskabatteries.com/vault.html">
  <link rel="icon" href="assets/brand/favicon.ico?v=3" sizes="any" />
  <link rel="icon" type="image/png" href="assets/brand/favicon-512.png?v=3" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png?v=3" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/banner.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>

<body class="bg-white overflow-x-hidden">
  <div id="header-placeholder"></div>

  <main class="bg-white">
    <section id="gallery"
      class="page-banner flex items-center justify-center text-center bg-white overflow-hidden group">
      <div class="relative md:h-[400px] w-full flex flex-col banner-wrapper">
        <img src="assets/vault/gallery.webp" alt="Gallery"
          class="w-full h-full object-cover object-center transition-transform duration-1000" />
        <div id="hero-text-box"
          class="absolute bottom-1 left-0 right-0 md:bottom-auto md:top-20 md:left-8 md:w-[450px] bg-black/75 px-4 py-2 rounded-lg md:px-8 md:py-8 md:rounded-lg md:border md:border-white/20 md:bg-black/80 max-h-[150px] md:max-h-none overflow-hidden">
          <h1
            class="text-3xl md:text-5xl font-bold uppercase text-left md:pt-0 tracking-normal leading-tight text-white">
            Gallery</h1>
        </div>
      </div>
    </section>
    <section id="gallery-content" class="px-4 py-8 bg-white text-zinc-900 overflow-hidden border-t border-gray-100">
      <div class="container mx-auto px-[-8px] md:px-6 mb-2">
        <div class="flex flex-col md:flex-row justify-center items-center md:items-center gap-4 mb-6">
          <div
            class="flex md:grid md:grid-cols-3 gap-0 md:gap-4 w-full max-w-2xl mx-auto px-0 md:px-0 overflow-x-auto no-scrollbar items-center py-2">
            <button onclick="updateGallery('corporate')"
              class="gallery-filter-btn filter-btn btn-secondary btn-lg active bg-gray-100 text-zinc-900 px-0 py-2 text-sm md:px-2 md:py-2 md:text-sm rounded-lg font-bold uppercase hover:bg-gray-200 transition-all leading-tight flex-shrink-1"
              data-category="corporate">
              Corporate
            </button>

            <button onclick="updateGallery('dealer')"
              class="gallery-filter-btn filter-btn btn-secondary bg-gray-100 text-zinc-900 px-2 py-2 text-sm md:px-2 md:py-2 md:text-sm rounded-lg font-bold uppercase hover:bg-gray-200 transition-all leading-tight flex-shrink-1"
              data-category="dealer">
              Partner
            </button>

            <button onclick="updateGallery('awards')"
              class="gallery-filter-btn filter-btn btn-secondary bg-gray-100 text-zinc-900 px-2 py-2 text-sm md:px-2 md:py-2 md:text-sm rounded-lg font-bold uppercase hover:bg-gray-200 transition-all leading-tight flex-shrink-1"
              data-category="awards">
              Awards
            </button>
          </div>
        </div>
      </div>

      <!-- Desktop Gallery View -->
      <div id="gallery-rail" class="gallery-scrollbar hidden md:flex"></div>

      <!-- Desktop Gallery Scroll Chevrons -->
      <div class="hidden md:flex justify-center gap-4 mt-6">
        <button onclick="scrollGallery(-1)"
          class="h-12 w-12 rounded-full border border-gray-200 flex items-center justify-center hover:bg-black hover:text-white transition-all">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button onclick="scrollGallery(1)"
          class="h-12 w-12 rounded-full border border-gray-200 flex items-center justify-center hover:bg-black hover:text-white transition-all">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Mobile Gallery View -->
      <div class="md:hidden">
        <div id="mobile-gallery-container">
          <div class="relative h-72 flex items-center justify-between overflow-visible">
            <div id="mobile-left-image" class="w-[30%] h-40 rounded-lg overflow-hidden cursor-pointer"
              onclick="handleMobileImageClick(-1)">
              <img id="mobile-left-img" src="" alt="Left" class="w-full h-full object-cover mobile-side-img">
            </div>
            <div id="mobile-feature-image"
              class="absolute left-1/2 -translate-x-1/2 w-[72%] h-72 rounded-lg overflow-hidden cursor-pointer z-10"
              onclick="handleMobileImageClick(0)">
              <img id="mobile-feature-img" src="" alt="Featured" class="w-full h-full object-cover mobile-feature-img">
            </div>
            <div id="mobile-right-image" class="w-[30%] h-40 rounded-lg overflow-hidden cursor-pointer"
              onclick="handleMobileImageClick(1)">
              <img id="mobile-right-img" src="" alt="Right" class="w-full h-full object-cover mobile-side-img">
            </div>
          </div>

          <!-- Dot Pagination with Navigation -->
          <div class="flex items-center justify-center gap-4 mt-2">
            <button onclick="mobilePrevGallery()"
              class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:bg-gray-100 transition-all">
              <i class="fa-solid fa-chevron-left text-xs text-gray-600"></i>
            </button>

            <div id="mobile-gallery-dots" class="flex items-center gap-2">
              <!-- Dots will be generated by JavaScript -->
            </div>

            <button onclick="mobileNextGallery()"
              class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:bg-gray-100 transition-all">
              <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div id="gallery-lightbox"
      class="fixed inset-0 z-[2000] hidden bg-black/98 flex flex-col items-center justify-center backdrop-blur-xl"
      onclick="handleLightboxClick(event)">
      <button onclick="closeLightbox()"
        class="absolute top-4 right-4 md:top-6 md:right-6 z-[2100] text-white/50 hover:text-white text-4xl md:text-5xl font-extralight transition-all p-2">&times;</button>

      <button onclick="prevLightbox()"
        class="hidden md:flex absolute left-6 top-1/2 -translate-y-1/2 z-[2100] w-14 h-14 items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-all">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button onclick="nextLightbox()"
        class="hidden md:flex absolute right-6 top-1/2 -translate-y-1/2 z-[2100] w-14 h-14 items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-all">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- Mobile swipe buttons -->
      <button onclick="prevLightbox()"
        class="flex md:hidden absolute left-2 top-1/2 -translate-y-1/2 z-[2100] w-10 h-10 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition-all">
        <i class="fa-solid fa-chevron-left text-sm"></i>
      </button>
      <button onclick="nextLightbox()"
        class="flex md:hidden absolute right-2 top-1/2 -translate-y-1/2 z-[2100] w-10 h-10 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition-all">
        <i class="fa-solid fa-chevron-right text-sm"></i>
      </button>

      <div id="lightbox-slider"
        class="w-full h-full flex items-center overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth touch-pan-x">
      </div>

      <div class="absolute bottom-8 text-center pointer-events-none">
        <p class="text-zinc-500 text-[10px] uppercase tracking-[0.4em] mt-2">Swipe or Use Arrows to Explore</p>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

</body>

</html>
